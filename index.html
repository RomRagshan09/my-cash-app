<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Cash App</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header>

        <div>

            <h1>My Cash App</h1>

            <p>Personal Cash Management</p>

        </div>

        <button
            class="refresh-button"
            onclick="loadDashboard()">

            ↻

        </button>

    </header>



    <!-- BALANCE -->

    <section class="balance-card">

        <p>Current Balance</p>

        <h2 id="balance">

            LKR 0.00

        </h2>

    </section>



    <!-- SUMMARY -->

    <section class="summary">


        <div class="summary-card income-card">

            <div class="summary-icon">
                +
            </div>

            <div>

                <p>Total Income</p>

                <h3 id="income">

                    LKR 0.00

                </h3>

            </div>

        </div>



        <div class="summary-card expense-card">

            <div class="summary-icon">
                −
            </div>

            <div>

                <p>Total Expenses</p>

                <h3 id="expense">

                    LKR 0.00

                </h3>

            </div>

        </div>


    </section>



    <!-- ADD TRANSACTION -->

    <section class="transaction-form">

        <h2>Add Transaction</h2>


        <div class="type-buttons">

            <button
                id="incomeBtn"
                class="active"
                onclick="setType('income')">

                + Income

            </button>


            <button
                id="expenseBtn"
                onclick="setType('expense')">

                − Expense

            </button>

        </div>



        <label>Date</label>

        <input
            type="date"
            id="date">



        <label>Description</label>

        <input
            type="text"
            id="description"
            placeholder="e.g. Salary, Food, Fuel">



        <label>Category</label>

        <select id="category">

            <option value="Salary">
                Salary
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Transport">
                Transport
            </option>

            <option value="Bills">
                Bills
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Entertainment">
                Entertainment
            </option>

            <option value="Savings">
                Savings
            </option>

            <option value="Other">
                Other
            </option>

        </select>



        <label>Amount</label>

        <input
            type="number"
            id="amount"
            placeholder="0.00"
            min="0"
            step="0.01">



        <button
            class="save-button"
            onclick="saveTransaction()">

            SAVE TRANSACTION

        </button>


        <p id="message"></p>

    </section>



    <!-- TRANSACTION HISTORY -->

    <section class="history">

        <div class="history-header">

            <h2>Transaction History</h2>

            <span id="transactionCount">
                0 transactions
            </span>

        </div>


        <div id="transactionList">

            <div class="empty-state">

                No transactions yet.

            </div>

        </div>

    </section>


</div>



<script src="app.js"></script>


</body>

</html>
